name: ci

# Every push and pull request runs the same tests a release does, so a change that breaks something is
# found when it is made rather than when a release is tagged.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --release

  linux:
    # The headless node (talkeed) and the crates under it, on the OS they run on.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release -p talkee-crypto -p talkee-store -p talkee-mesh -p talkee-daemon

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter tests
        working-directory: app
        run: flutter test
      # The Gradle wrapper is not kept in the repository; Flutter writes it.
      - name: Prepare Gradle
        working-directory: app
        run: flutter build apk --config-only
      - name: Kotlin tests
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest
