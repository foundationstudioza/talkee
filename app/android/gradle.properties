org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental caches assert that a source file and the cache share a root, and they do not
# here: plugins are compiled out of the pub cache on C: while this project lives on E:. The failure
# is an AssertionError with "this and base files have different roots" while *closing* the caches, so
# it looks like a cache-corruption bug rather than a path problem. Turning incremental compilation off
# costs a slower Kotlin build and removes a whole class of confusing failure.
kotlin.incremental=false
