[package]
name = "talkee-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Talkee audio pipeline: jitter buffer, drift control, UDP transport. No platform or UI code."

[dependencies]
talkee-proto = { workspace = true }
anyhow = { workspace = true }

# Voice codec: libopus, built from the bundled source. Opus is what makes a phone on a weak network
# usable: about 40 times less data than raw samples, and a decoder that can conceal a lost packet.
opus = "0.4"

# WebRTC audio processing in pure Rust: echo cancellation without a C++ toolchain.
sonora = "0.2"
